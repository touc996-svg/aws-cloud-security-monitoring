name: AEGIS-X IaC Security

on:
  pull_request:
    paths:
      - 'aegis-x/**'
      - '.github/workflows/aegis-x-iac-security.yml'
  push:
    branches: [main]
    paths:
      - 'aegis-x/**'
      - '.github/workflows/aegis-x-iac-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-validation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [bootstrap, aws-governance]
    defaults:
      run:
        working-directory: aegis-x/terraform/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.17.1'
      - name: Terraform format
        run: terraform fmt -check -recursive
      - name: Terraform initialization
        run: terraform init -backend=false
      - name: Terraform validation
        run: terraform validate

  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkov IaC scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: aegis-x/terraform
          framework: terraform
          soft_fail: false

  integration-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aegis-x/integrations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run normalizer tests
        run: python -m pytest -q tests
